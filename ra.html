<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Jaca RA — Vista de cámara</title>

  <!-- Motor 3D y realidad aumentada (versiones fijas, las del juego) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <!-- Datos de los hitos y figuras 3D temáticas (archivos del repositorio) -->
  <script src="hitos.js"></script>
  <script src="modelos.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

    /* ---------- Barra superior: nombre del hito y estado del GPS ---------- */
    #barra {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 12px 16px;
      background: rgba(16, 21, 31, 0.85);
      color: #f1e7d0;
    }
    #barra h1 { margin: 0; font-size: 17px; font-weight: 600; }
    #estado { margin: 4px 0 0; font-size: 13px; color: #d9d2c2; }

    #prueba {
      position: fixed; left: 0; right: 0; z-index: 10;
      top: 62px;
      background: #d9a62e; color: #10151f;
      font-size: 12.5px; font-weight: 700;
      text-align: center; padding: 6px 12px;
      display: none;
    }

    /* Franja azul de avisos: aquí te explicamos qué falla y cómo arreglarlo */
    #aviso {
      position: fixed; left: 0; right: 0; z-index: 11;
      top: 62px;
      background: #2a6bd4; color: #ffffff;
      font-size: 13px; font-weight: 600; line-height: 1.4;
      text-align: center; padding: 8px 14px;
      display: none;
    }

    /* ---------- Flecha guía hacia la figura ----------
       El momento más confuso del juego es no saber hacia dónde
       mirar. Cuando la figura queda fuera de pantalla, esta
       píldora aparece en el borde indicando hacia dónde girar. */
    .flecha {
      position: fixed; top: 50%; z-index: 9;
      transform: translateY(-50%);
      display: none;
      background: #d9a62e; color: #10151f;
      font-weight: 700; font-size: 1rem;
      padding: 12px 14px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      animation: latido 1.1s infinite;
      pointer-events: none;
    }
    .flecha.izquierda { left: 10px; }
    .flecha.derecha { right: 10px; }

    @keyframes latido {
      50% { transform: translateY(-50%) scale(1.12); }
    }

    /* ---------- Botones inferiores ---------- */
    #acciones {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      display: flex; gap: 10px;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(16, 21, 31, 0.9), rgba(16, 21, 31, 0));
    }
    #btnDescubrir {
      flex: 1.4; padding: 14px; border: none; border-radius: 14px;
      background: #d9a62e; color: #10151f;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    #btnDescubrir:disabled { opacity: 0.45; }
    #volver {
      flex: 1; padding: 14px; border-radius: 14px;
      background: rgba(241, 231, 208, 0.12); color: #f1e7d0;
      border: 1px solid rgba(241, 231, 208, 0.35);
      font-size: 15px; text-align: center; text-decoration: none;
    }

    /* ---------- Ficha histórica al descubrir el hito ---------- */
    #ficha {
      position: fixed; inset: 0; z-index: 20;
      display: none;
      align-items: center; justify-content: center;
      padding: 22px;
      background: rgba(16, 21, 31, 0.78);
    }
    #ficha.visible { display: flex; }
    #ficha .tarjeta {
      width: 100%; max-width: 420px;
      background: #f7f1e2; color: #2b2620;
      border-radius: 18px; border-top: 6px solid #d9a62e;
      padding: 22px;
    }
    #ficha h2 { margin: 0 0 4px; font-size: 21px; }
    #ficha .epoca {
      margin: 0 0 12px; font-size: 12.5px; font-weight: 700;
      letter-spacing: 0.6px; text-transform: uppercase; color: #8a6a1c;
    }
    #ficha p { margin: 0 0 18px; font-size: 15px; line-height: 1.55; }
    #ficha .sello { font-size: 13px; font-weight: 700; color: #1f7a45; margin: 0 0 14px; }
    #fichaVolver {
      display: block; width: 100%; padding: 14px;
      border: none; border-radius: 12px;
      background: #d9a62e; color: #10151f;
      font-size: 16px; font-weight: 700; cursor: pointer;
      text-align: center; text-decoration: none;
    }
  </style>
</head>
<body>

  <div id="barra">
    <h1 id="titulo">Jaca RA</h1>
    <p id="estado">Buscando señal GPS… (a cielo abierto va más rápido)</p>
  </div>
  <div id="prueba">🧪 Modo prueba: posición simulada junto al hito</div>
  <div id="aviso"></div>

  <!-- Flecha que indica hacia dónde girar cuando la figura no está en pantalla -->
  <div class="flecha" id="flechaGuia"></div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false">
    <!-- El "dedo láser": permite tocar las piezas con clase clickable -->
    <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 10000"></a-entity>
  </a-scene>

  <div id="acciones">
    <button id="btnDescubrir" disabled>⭐ ¡Descubrir hito!</button>
    <a id="volver" href="index.html">← Mapa</a>
  </div>

  <div id="ficha">
    <div class="tarjeta">
      <h2 id="fichaNombre"></h2>
      <p class="epoca" id="fichaEpoca"></p>
      <p id="fichaTexto"></p>
      <p class="sello">✓ Hito descubierto — guardado en tu progreso</p>
      <a id="fichaVolver" href="index.html">Volver al mapa</a>
    </div>
  </div>

  <script>
    // ==========================================================
    // 1. LEER LA DIRECCIÓN: ¿qué hito toca y estamos en modo prueba?
    //    (index.html abre esta página como  ra.html?hito=catedral)
    // ==========================================================
    const parametros = new URLSearchParams(window.location.search);
    const modoPrueba = parametros.get("test") === "1";
    const hito = buscarHito(parametros.get("hito") || parametros.get("id"));

    if (!hito) {
      // Sin hito válido no hay nada que mostrar: de vuelta al mapa
      window.location.href = "index.html" + (modoPrueba ? "?test=1" : "");
    }

    if (hito) {
      // ---------- Preparar la interfaz ----------
      const estado = document.getElementById("estado");
      const boton = document.getElementById("btnDescubrir");
      const ficha = document.getElementById("ficha");

      document.getElementById("titulo").textContent = hito.emoji + " " + hito.nombre;
      document.getElementById("fichaNombre").textContent = hito.emoji + " " + hito.nombre;
      document.getElementById("fichaEpoca").textContent = hito.epoca;
      document.getElementById("fichaTexto").textContent = hito.descripcion;

      // Los enlaces de volver conservan el modo prueba si está activo
      const urlMapa = "index.html" + (modoPrueba ? "?test=1" : "");
      document.getElementById("volver").href = urlMapa;
      document.getElementById("fichaVolver").href = urlMapa;
      if (modoPrueba) document.getElementById("prueba").style.display = "block";

      let distanciaActual = Infinity;
      let descubierto = cargarDescubiertos().includes(hito.id);
      let figura = null;
      let ancla = null;                 // el ancla de la figura 3D; la flecha guía consulta su posición
      let radarListo = modoPrueba;      // en modo prueba no esperamos al GPS real

      if (descubierto) boton.textContent = "📜 Ver ficha";

      // ==========================================================
      // 2. MONTAR LA ESCENA RA
      //    - Una cámara que se mueve con tu GPS real
      //    - La figura temática del hito anclada a sus coordenadas
      // ==========================================================
      const escena = document.querySelector("a-scene");

      function montarEscena() {
        // --- Cámara GPS ---
        const camara = document.createElement("a-camera");
        let propiedadesGPS = "gpsMinDistance: 3";

        if (modoPrueba) {
          // En modo prueba fingimos estar a unos 25 m al sur del hito,
          // así la figura aparece sin necesidad de ir a Jaca.
          const latSimulada = hito.lat - 0.00022;
          propiedadesGPS += "; simulateLatitude: " + latSimulada + "; simulateLongitude: " + hito.lon;
        }

        camara.setAttribute("gps-new-camera", propiedadesGPS);
        escena.appendChild(camara);

        // Cada vez que el GPS actualiza tu posición, recalculamos la distancia
        camara.addEventListener("gps-camera-update-position", function (evento) {
          const pos = evento.detail.position;
          radarListo = true; // la cámara RA ya sabe dónde estás: la flecha puede funcionar
          alActualizarPosicion(pos.latitude, pos.longitude);
        });

        // --- Figura 3D del hito ---
        ancla = document.createElement("a-entity");
        ancla.setAttribute("gps-new-entity-place", "latitude: " + hito.lat + "; longitude: " + hito.lon);

        if (typeof crearModelo === "function") {
          // La figura temática de modelos.js (llave, fortaleza, torre...)
          figura = crearModelo(hito.id);
        } else {
          // Red de seguridad: si modelos.js no está subido al repositorio,
          // el juego sigue funcionando con el octaedro dorado de siempre.
          figura = document.createElement("a-octahedron");
          figura.setAttribute("radius", "5");
          figura.setAttribute("material", "color: #C9972B; metalness: 0.6; roughness: 0.3; emissive: #5e4408");
          figura.setAttribute("animation", "property: rotation; to: 0 360 0; dur: 7000; easing: linear; loop: true");
          figura.setAttribute("animation__flotar", "property: position; from: 0 -0.8 0; to: 0 0.8 0; dir: alternate; dur: 1600; easing: easeInOutSine; loop: true");
        }
        figura.classList.add("clickable");
        // Tocar la figura también descubre el hito (si estás lo bastante cerca)
        figura.addEventListener("click", intentarDescubrir);
        ancla.appendChild(figura);

        // Etiqueta con el nombre, flotando sobre la figura
        const etiqueta = document.createElement("a-text");
        etiqueta.setAttribute("value", hito.nombre);
        etiqueta.setAttribute("position", "0 9 0");
        etiqueta.setAttribute("align", "center");
        etiqueta.setAttribute("width", "45");
        etiqueta.setAttribute("color", "#FFFFFF");
        etiqueta.setAttribute("side", "double");
        ancla.appendChild(etiqueta);

        escena.appendChild(ancla);
      }

      if (escena.hasLoaded) {
        montarEscena();
      } else {
        escena.addEventListener("loaded", montarEscena);
      }

      // ==========================================================
      // 3. DISTANCIA Y DESCUBRIMIENTO
      // ==========================================================
      function alActualizarPosicion(lat, lon) {
        distanciaActual = distanciaMetros(lat, lon, hito.lat, hito.lon);
        const metros = Math.round(distanciaActual);
        const alAlcance = distanciaActual <= hito.radio;
        const senal = precisionActual ? " (señal ±" + precisionActual + " m)" : "";

        estado.textContent = "A " + metros + " m" + senal + " · " +
          (alAlcance ? "¡al alcance!" : "sigue acercándote (a menos de " + hito.radio + " m)");

        if (!descubierto) boton.disabled = !alAlcance;
      }

      function intentarDescubrir() {
        // Si ya estaba descubierto, solo reabrimos su ficha
        if (descubierto) { mostrarFicha(); return; }

        if (distanciaActual > hito.radio) {
          estado.textContent = "Aún estás a " + Math.round(distanciaActual) +
            " m; acércate a menos de " + hito.radio + " m.";
          return;
        }

        descubierto = true;
        marcarDescubierto(hito.id);
        if (navigator.vibrate) navigator.vibrate(120);

        // Pequeño efecto de captura: la figura se encoge antes de la ficha
        if (figura) {
          figura.setAttribute("animation__captura",
            "property: scale; to: 0.01 0.01 0.01; dur: 420; easing: easeInBack");
        }
        boton.textContent = "📜 Ver ficha";
        boton.disabled = false;

        setTimeout(mostrarFicha, 450);
      }

      function mostrarFicha() {
        ficha.classList.add("visible");
      }

      boton.addEventListener("click", intentarDescubrir);

      // ==========================================================
      // 4. VIGILANTE DEL GPS (diagnóstico en español)
      //    AR.js ya pide la ubicación para mover la cámara, pero
      //    cuando algo falla sus avisos salen en inglés o ni se ven.
      //    Aquí también la pedimos nosotros: así el juego (distancia
      //    y botón) funciona aunque AR.js falle, y podemos decirte
      //    exactamente qué pasa y cómo arreglarlo.
      // ==========================================================
      let precisionActual = 0;
      let avisoPrecisionMostrado = false;

      if (!modoPrueba) {
        // a) ¿En qué estado está el permiso de ubicación?
        if (navigator.permissions && navigator.permissions.query) {
          navigator.permissions
            .query({ name: "geolocation" })
            .then(function (permiso) {
              avisarSegunPermiso(permiso.state);
              permiso.onchange = function () { avisarSegunPermiso(permiso.state); };
            })
            .catch(function () { /* algunos navegadores no lo soportan; no pasa nada */ });
        }

        // b) Pedir la posición de forma continua, con máxima precisión
        navigator.geolocation.watchPosition(
          function (pos) {
            precisionActual = Math.round(pos.coords.accuracy);
            alActualizarPosicion(pos.coords.latitude, pos.coords.longitude);

            // Si la señal es muy gruesa, casi seguro que el permiso
            // se dio como "Aproximada" en vez de "Precisa".
            if (precisionActual > 30 && !avisoPrecisionMostrado) {
              avisoPrecisionMostrado = true;
              mostrarAviso("📡 Señal poco precisa (±" + precisionActual +
                " m). Toca el 🔒 de la barra de dirección → Permisos → Ubicación y marca «Precisa». Luego recarga.");
            }
          },
          function (error) {
            // error.code: 1 = permiso denegado · 2 = sin posición · 3 = tardó demasiado
            if (error.code === 1) {
              estado.textContent = "⛔ Permiso de ubicación bloqueado.";
              mostrarAviso("Toca el icono 🔒 junto a la dirección → Permisos → Ubicación → Permitir, y recarga la página.", true);
            } else if (error.code === 2) {
              estado.textContent = "El móvil no consigue calcular tu posición.";
              mostrarAviso("Activa la «Ubicación» del teléfono (en los ajustes rápidos de la barra superior) y recarga.", true);
            } else {
              estado.textContent = "El GPS está tardando… sal a cielo abierto y espera unos segundos.";
            }
          },
          { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
        );
      }

      function avisarSegunPermiso(estadoPermiso) {
        if (estadoPermiso === "prompt") {
          mostrarAviso("Cuando el navegador pregunte, elige «Precisa» y «Permitir mientras se visita el sitio» 👍");
        } else if (estadoPermiso === "denied") {
          estado.textContent = "⛔ Permiso de ubicación bloqueado.";
          mostrarAviso("Toca el icono 🔒 junto a la dirección → Permisos → Ubicación → Permitir, y recarga la página.", true);
        }
      }

      // ==========================================================
      // 5. PLAN B DE LA BRÚJULA
      //    En el móvil, AR.js gira la vista con la brújula y el
      //    giroscopio y DESACTIVA el arrastre con el dedo. Si los
      //    sensores no responden, la vista se queda congelada y es
      //    imposible encontrar la figura (por eso en «vista de
      //    ordenador» sí la veías: ahí el arrastre está activado).
      //    Si en 6 segundos no llega ningún dato del sensor,
      //    reactivamos el arrastre para que puedas mirar alrededor.
      // ==========================================================
      let brujulaFunciona = false;
      function anotarSensor(evento) {
        if (evento.alpha !== null && evento.alpha !== undefined) brujulaFunciona = true;
      }
      window.addEventListener("deviceorientationabsolute", anotarSensor);
      window.addEventListener("deviceorientation", anotarSensor);

      setTimeout(function () {
        const camara = document.querySelector("[gps-new-camera]");
        // Solo actuamos si AR.js puso el control por sensores (es decir, en móvil)
        if (!brujulaFunciona && camara && camara.hasAttribute("arjs-device-orientation-controls")) {
          camara.removeAttribute("arjs-device-orientation-controls");
          camara.setAttribute("look-controls-enabled", "true");
          mostrarAviso("🧭 Tu móvil no envía datos de brújula: arrastra el dedo por la pantalla para mirar alrededor.", true);
        }
      }, 6000);

      // ==========================================================
      // 6. AVISOS EN PANTALLA (la franja azul bajo la barra)
      //    Los avisos "fijos" se quedan; el resto desaparece solo.
      // ==========================================================
      const cajaAviso = document.getElementById("aviso");
      let temporizadorAviso = null;

      function mostrarAviso(texto, fijo) {
        cajaAviso.textContent = texto;
        cajaAviso.style.display = "block";
        clearTimeout(temporizadorAviso);
        if (!fijo) {
          temporizadorAviso = setTimeout(function () {
            cajaAviso.style.display = "none";
          }, 9000);
        }
      }

      // ==========================================================
      // 7. FLECHA GUÍA
      //    Varias veces por segundo comprobamos si la figura cae
      //    dentro del encuadre de la cámara. Si no, mostramos una
      //    flecha en el borde que indica hacia dónde girar.
      //    Solo actúa cuando la cámara RA ya conoce tu posición
      //    (radarListo) y mientras el hito siga sin descubrir.
      // ==========================================================
      const flecha = document.getElementById("flechaGuia");
      const posicionMundo = new THREE.Vector3();
      const posicionRelativa = new THREE.Vector3();

      setInterval(function () {
        const camara3D = escena.camera; // la cámara interna de A-Frame
        if (!radarListo || descubierto || !ancla || !camara3D) {
          flecha.style.display = "none";
          return;
        }

        // Posición de la figura vista "desde la cámara":
        // x positivo = a tu derecha · z negativo = delante de ti
        ancla.object3D.getWorldPosition(posicionMundo);
        posicionRelativa.copy(posicionMundo).applyMatrix4(camara3D.matrixWorldInverse);

        // ¿Está dentro del encuadre? (proyectamos a coordenadas de pantalla:
        // el resultado va de -1 a 1, con el (0,0) en el centro de la pantalla)
        let enPantalla = false;
        if (posicionRelativa.z < 0) {
          const proyectado = posicionMundo.clone().project(camara3D);
          enPantalla = Math.abs(proyectado.x) <= 1 && Math.abs(proyectado.y) <= 1;
        }

        if (enPantalla) {
          flecha.style.display = "none";
        } else {
          const haciaLaDerecha = posicionRelativa.x > 0;
          flecha.textContent = haciaLaDerecha ? "Gira ❯" : "❮ Gira";
          flecha.classList.toggle("derecha", haciaLaDerecha);
          flecha.classList.toggle("izquierda", !haciaLaDerecha);
          flecha.style.display = "block";
        }
      }, 200);
    }
  </script>
</body>
</html>
